<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>天際大廈</title>
<meta name="description" content="仿 SimTower / Yoot Tower 嘅網頁起樓經營遊戲：起辦公室、住宅、酒店、電梯，將大廈由 1★ 經營到 TOWER 級。">
<meta name="theme-color" content="#0e1114">
<link rel="canonical" href="https://fiveathree.github.io/simtower/">
<meta property="og:type" content="website">
<meta property="og:title" content="天際大廈">
<meta property="og:description" content="起樓、放租、安排電梯，將大廈由 1★ 經營到 TOWER 級。">
<meta property="og:url" content="https://fiveathree.github.io/simtower/">
<meta property="og:image" content="https://fiveathree.github.io/simtower/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://fiveathree.github.io/simtower/og.png">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><b>天際大廈</b><small id="siteName"></small><span id="stars" aria-label="星級"></span></div>
    <div class="led"><small>資金</small><span id="money">$0</span></div>
    <div class="led"><small>人口</small><span id="pop">0</span></div>
    <div class="led"><small id="dateL">第1年</small><span id="clock">07:00</span></div>
    <div class="speed" role="group" aria-label="速度">
      <button data-s="0" id="sp0">暫停</button><button data-s="1" id="sp1">1×</button><button data-s="2" id="sp2">2×</button><button data-s="3" id="sp3">4×</button>
    </div>
    <div id="goal"></div>
    <div class="menu">
      <button id="evalBtn" aria-pressed="false">評價</button>
      <button id="finBtn">財務</button>
      <button id="helpBtn">說明</button>
      <button id="slotBtn">存檔</button>
      <button id="soundBtn" aria-pressed="false">聲音</button>
      <button id="shotBtn">截圖</button>
      <button id="newBtn">新遊戲</button>
    </div>
  </header>
  <nav id="tools" aria-label="建造工具"></nav>
  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="hint"></div>
    <div id="alert" hidden></div>
    <div id="tut" hidden></div>
    <div id="log" aria-live="polite"></div>
    <aside id="info" hidden></aside>
  </main>
</div>
<div id="modal" hidden><div class="card" id="mcard"></div></div>
<script type="module" src="src/main.js" onerror="document.getElementById('modal').hidden=false;document.getElementById('mcard').innerHTML='<h2>開唔到遊戲</h2><p>瀏覽器唔准直接由檔案載入模組，請用 GitHub Pages 或者本機伺服器開（睇 README）。</p>'"></script>
</body>
</html>
